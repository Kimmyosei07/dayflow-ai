[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  # `netlify dev` runs Vite and the functions together on http://localhost:8888
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

[functions]
  node_bundler = "esbuild"

# Single-page-app fallback so React Router URLs such as /tasks work on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
